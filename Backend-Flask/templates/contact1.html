<!DOCTYPE html>
<html>

<head>

    {%block title%}
        <title>Contact Page</title>
    {% endblock %}
    
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device,width, initial-scale=1"/>

    <link rel="stylesheet" href="{{ url_for('static', filename='home1.css')}}"/>

    <link rel="stylesheet" href="{{ url_for('static', filename='contact1.css')}}"/>

    <!--Font Awesome Icons-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
     integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" 
     crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>

<body> 
    
    <ul>
        <!--Logo-->
        <img src="https://i.postimg.cc/YCpDt5fF/Screenshot-2025-10-10-001046.jpg" width="70px" height="70px" margin-left="20%">

        <li><a style="border:solid black;"><i class="fa-solid fa-house" style="color:aqua;"></i>Home</a></li>
        <li><a   href="/Backend-Flask/templates/contact1.html" class="active" style="border:solid black;"><i class="fa-solid fa-envelope" style="color:aqua"></i>Contact</a></li>
        <li><a  style="border:solid black;"><i class="fa-solid fa-user" style="color:aqua"></i>Login/Register</a></li>
        <li><a  style="border:solid black;"><i class="fa-solid fa-circle-info" style="color:aqua"></i>About Us</a></li>
        <li><a  style="border:solid black;"><i class="fa-solid fa-calendar" style="color:aqua"></i>Booking</a></li>

    </ul>


 <!--Contact Form + Details-->
     <h1>Contact Us</h1>

     <!--Contact Form-->
     <div class="container_contactfrm">
        <form  method="POST">
            
            <br>
            <label class="label">Name</label>
            <br>
            <input class="field" name="name" placeholder="Enter Name..."></input>

            <br>
            
            <!--Change to email instead of subject message!-->
            <label class="label" >Subject of Message</label>
            <select class="field" name="Booking_options">
                <option value="Quote">Quote</option>
                <option value="Refunds">Refund</option>
                <option value="Any Questions">Any Questions</option>

            </select>
            <br>

            <label class="label">Enter Message Below:</label>
            <br>
            <textarea name="message" class="field">

            </textarea>
            <br>

            <!--Submit Button-->
            <input type="submit" value="Submit"></input>
            
        </form>
     </div>

    <!--Image-->
    <div class="contact_img" >
        <img class="contact_img" src="https://i.postimg.cc/PxH0c0H6/contact-2.jpg">
     </div>

    <!--Contact Image and Message-->
    <div class="message">
        <p>Fill in the form here! <br> 
        and we will get back to you within 3 business days!</p>
    </div> 

   <footer>
        <hr style="width:95%;">
        @EasyBooking_2025
    </footer>
    
</body>
</html>
