{% extends "main.html" %}

{% block title %}Enter new password{% endblock %}

{%block body%}

{% if validalink %}

<h1>Set a new password!</h1>
<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="submit" value="Change my password">
</form>

{% else %}

<p>Password reset link was invalid, possible because it has already been used</p>

{% endif %}
{% endblock %}
