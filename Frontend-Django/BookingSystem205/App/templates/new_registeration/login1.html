<!DOCTYPE html>
<html lang="en" dir="ltr">
    <head> 
        {% load static %}
        <meta charset="utf-8">
        <title>Login</title>
        <!--add style folder and then add home + loginreg.css files below!-->
        <link rel="stylesheet" href="{% static 'login_reg.css' %}"
    </head>

    <body>
        <div class="container_2">
            <h1>Login</h1>

            <!--Flash messages-->
            {% if messages %}
                {% for message in messages %}
                    {% if message.tags == 'error'%}
                        <center><h4 style="color: firebrick">{{message}}</h4></center>
                    {% else %}
                        <center><h4 style="color: dodgerblue">{{message}}</h4></center>
                    {% endif %}
                {% endfor %}
            {% endif %}

            <form method="POST"> 
                
                {% csrf_token %}

                    <!--add correct fields according to customized fields already added!-->
                <div class="txt_field">
                    <input type="text" required name="username"> 
                    <span></span>
                    <label>Username</label>
                </div>

                <div class="txt_field">
                    <input type="password" required name="password">
                    <span></span>
                    <label>Password</label>
                </div>
                
                <input type="submit" value="Login">
                <div class="signup_link"> 
                    Don't have an account? <a href="{% url 'register' %}">Signup</a>
                    <p>Forgot your password? <a href="{% url 'forgot-password' %}">Reset Password</a></p>
                    <a href="{% url 'logout' %}">Logout</a>
                </div>
            </form>
        </div>

    </body>
</html>
