<!DOCTYPE html>
<html>
{% load static %}

<head>

    {%block title%}
        <title>Login Page</title>
    {% endblock %}
    
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device,width, initial-scale=1"/>

    <link rel="stylesheet" href="{% static 'main.css' %}"/>

    <link rel="stylesheet" href="{% static 'login_reg.css' %}"/>

    <!--Font Awesome Icons-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
     integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" 
     crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>

<body> 
    
    <ul>
        <!--Logo-->
        <img src="https://i.postimg.cc/YCpDt5fF/Screenshot-2025-10-10-001046.jpg" width="70px" height="70px" margin-left="20%">

        <li><a href="{% url 'home' %}" style="border:solid black;"><i class="fa-solid fa-house" style="color:aqua;"></i>Home</a></li>
        <li><a href="{% url 'contact' %}" style="border:solid black;"><i class="fa-solid fa-envelope" style="color:aqua"></i>Contact</a></li>
        <li><a href="{% url 'signup' %}" style="border:solid black;"><i class="fa-solid fa-user" style="color:aqua"></i>Login/Register</a></li>
        <li><a href="{% url 'about' %}" style="border:solid black;"><i class="fa-solid fa-circle-info" style="color:aqua"></i>About Us</a></li>
        <li><a href="{% url 'booking' %}" style="border:solid black;"><i class="fa-solid fa-calendar" style="color:aqua"></i>Booking</a></li>

        
    </ul>
    
    <!--Title-->
    <h1 class="title_2">Login</h1>
        
    <!--Login Form-->
    <div class="container_2">

        <form method="POST" enctype="multipart/form-data">
            <br>
            <br>
            {% csrf_token %}
            {{ form }}
            
            <p>Don't have an account yet?</p>
            <a href="{% url 'signup' %}">Register</a>

            <!--Edit Login/Signup Form-->
            <!--Edit Later on with .css file using {widget-tweaks}-->
           
            <input type="submit" value="Login"></input><br>
            <!--Don't Have an account yet-->

    </form>

    <br>
    </div>

   <footer>
        <hr style="width:95%;">
        &copy;EasyBooking_2025
    </footer>

</body>
</html>
