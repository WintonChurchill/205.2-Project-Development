<!DOCTYPE html>
<html lang="en" dir="ltr">
    <head> 
        {% load static %}
        <meta charset="utf-8">
        <title>Reset Password</title>
        <!--add style folder and then add home + loginreg.css files below!-->
        <link rel="stylesheet" href="{% static 'login_reg.css' %}"
    </head>

    <body>
        <div class="center">
            <h1>Reset Password</h1>

            <!--Flash messages-->
            {% if messages %}
                {% for message in messages %}
                    {% if message.tags == 'error' %}
                        <center><h4 style="color: firebrick">{{message}}</h4></center>
                    {% else %}
                        <center><h4 style="color: dodgerblue">{{message}}</h4></center>
                    {% endif %}
                {% endfor %}
            {% endif %}


            <form method="POST"> 

                {% csrf_token %}

                <!--add correct fields according to customized fields already added!-->
                <div class="txt_field">
                    <input type="password" required name="password">
                    <span></span>
                    <label>Password</label>
                </div>
                
                <!--Confirmation of password-->
                <div class="txt_field">
                    <input type="password" required name="password">
                    <span></span>
                    <label>Confirm Password</label>
                </div>
                

                <input type="submit" value="Reset Password">
                <div class="signup_link"> 
                    Already have an account? <a href="{% url 'login' %}">Login</a>
                </div>
            </form>
        </div>

    </body>
</html>
