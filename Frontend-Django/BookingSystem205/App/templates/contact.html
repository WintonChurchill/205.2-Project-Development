<!DOCTYPE html>
<html>
{% load static %}

<head>

    {%block title%}
        <title>Contact Page</title>
    {% endblock %}
    
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device,width, initial-scale=1"/>

    <link rel="stylesheet" href="{% static 'main.css' %}"/>

    <link rel="stylesheet" href="{% static 'contact.css' %}"/>

</head>

<body> 
    
    <ul>
        <!--Logo-->
        <img src="https://i.postimg.cc/YCpDt5fF/Screenshot-2025-10-10-001046.jpg" width="70px" height="70px" margin-left="20%">

        <li><a href="{% url 'home' %}">Home</a></li>
        <li><a class="active" href="{% url 'contact' %}">Contact</a></li>
        <li><a href="{% url 'Register' %}">Login/Register</a></li>
        <li><a href="{% url 'about' %}">About Us</a></li>
        <li><a href="{% url 'booking' %}">Booking</a></li>
        
    </ul>


 <!--Contact Form + Details-->
     <h1>Contact Us</h1>

     <!--Contact Form-->
     <div class="container_contactfrm">
        <form action="/templates/Login" method="POST">
            
            <br>
            <label class="label">Name</label>
            <br>
            <input class="field" placeholder="Enter Name..."></input>

            <br>
            
            <label class="label" >Subject of Message</label>
            <select class="field" name="Booking_options">
                <option value="Quote">Quote</option>
                <option value="Refunds">Refund</option>
                <option value="Any Questions">Any Questions</option>

            </select>
            <br>

            <label class="label">Enter Message Below:</label>
            <br>
            <textarea class="field">

            </textarea>
            <br>

            <!--Submit Button-->
            <input type="submit" value="Submit"></input>
            
        </form>
     </div>

    <!--Image-->
    <div class="contact_img" >
        <img class="contact_img" src="https://i.postimg.cc/PxH0c0H6/contact-2.jpg">
     </div>

    <!--Contact Image and Message-->
    <div class="message">
        <p>Fill in the form here! <br> 
        and we will get back to you within 3 business days!</p>
    </div> 

   <footer>
        <hr style="width:95%;">
        @EasyBooking_2025
    </footer>
    
</body>
</html>
