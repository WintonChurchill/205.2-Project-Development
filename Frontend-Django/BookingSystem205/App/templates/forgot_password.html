<!--Forgot Password-->
{% extends "main.html" %}

{% block title %}Forgot Your Password? {% endblock%}

{% block body %}
<h1>Forgot your password?</h1>
<p>Enter your email Address below, and the instructions for reseting your password will be sent!</p>

<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="submit" value="Send me instructions">
</form>
{% endblock %}
