<!DOCTYPE html>
<html lang="en" dir="ltr">
    <head> 
        {% load static %}
        <meta charset="utf-8">
        <title>Forgot Password</title>
        
            <!--CSS connect - home.css -->
        <link rel="stylesheet" href="{% static 'home.css' %}"/>

        <!--add style folder and then add home + loginreg.css files below-->
        <link rel="stylesheet" href="{% static 'login_reg.css' %}"/>

        
    <!--Font Awesome Icons-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
     integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" 
     crossorigin="anonymous" referrerpolicy="no-referrer" />
     
    </head>

    <body>

        <div class="center">
            <h1>Forgot Password</h1>

            <!--Flash messages-->
            {% if messages %}
                {% for message in messages %}
                    {% if message.tags == 'error'%}
                        <center><h4 style="color: firebrick">{{message}}</h4></center>
                    {% else %}
                        <center><h4 style="color: dodgerblue">{{message}}</h4></center>
                    {% endif %}
                {% endfor %}
            {% endif %}

            <div class="signup_link">Enter your email address to reset password:</div>

            <form method="POST"> 

                {% csrf_token %}

                
                <div class="txt_field"><!--add verification if enough time this evening and push all work to github!-->
                    <input type="email" required name="username"> 
                    <span></span>
                    <label>Email</label>
                </div>

                <input type="submit" value="Reset Password">
                <div class="signup_link"> 
                    Already have an account? <a href="{% url 'login' %}">Login</a>
                </div>
            </form>
        </div>

    </body>
</html>
